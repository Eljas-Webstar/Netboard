/* ---------------- Alle Firmen ----------------
   Eine Firma mit mehreren Clubs steht einmal da (Abgleich über namensSchluessel), gespeichert bleibt sie
   pro Club. Gruppen und Sortierungen werden beim Zeichnen der Ansicht einmal gebaut, beim Tippen wird nur
   gefiltert und höchstens S.fs.zahl Karten gezeichnet. */
var FG=null, FT=[];
var KOLL=(window.Intl&&Intl.Collator) ? new Intl.Collator("de",{sensitivity:"base",numeric:true}) : null;
function vergleich(a,b){ return KOLL ? KOLL.compare(a,b) : String(a).localeCompare(b,"de"); }
function tausend(n){ return Number(n).toLocaleString("de-DE"); }
function fsLeer(alt){ return { q:"", club:"", liga:"", branche:"", verbindung:"", min:"", ap:false, sort:alt?alt.sort:"nutzen", zahl:100, offen:alt?alt.offen:undefined }; }
function firmenGruppen(){
  var cm={}, pm={}, nach={}, l=[];
  D.clubs.forEach(function(c){ cm[c.id]=c; });
  D.personen.forEach(function(p){ pm[p.id]=p; });
  D.firmen.forEach(function(f){
    var c=cm[f.clubId]; if(!c) return;
    var k=namensSchluessel(f.name)||f.id, x=nach[k];
    if(!x){ x=nach[k]={ k:k, e:[], clubs:[] }; l.push(x); }
    x.e.push({ f:f, c:c, n:nutzenWert(f), br:norm(f.branche), vb:norm(f.verbindung), liga:norm(c.liga), p:(f.personId&&pm[f.personId])||null });
    if(x.clubs.indexOf(c)<0) x.clubs.push(c);
  });
  l.forEach(function(x){
    x.e.sort(function(a,b){ return b.n-a.n || vergleich(a.c.name,b.c.name); });
    function erstes(k){ var y=x.e.filter(function(z){ return z.f[k]; })[0]; return y?y.f[k]:""; }
    x.name=x.e[0].f.name; x.nutzen=x.e[0].n; x.branche=erstes("branche"); x.ort=erstes("ort"); x.land=erstes("land"); x.website=erstes("website");
    x.ap=x.e.some(function(y){ return y.p; });
    x.clubs.sort(function(a,b){ return vergleich(a.name,b.name); });
    x.such=ohneAkzent(x.e.map(function(y){ return [y.f.name,y.f.branche,y.f.ort,y.f.kooperationsidee].join(" "); }).join(" "));
  });
  return { l:l, sortiert:{}, werte:{} };
}
function firmenSortiert(art){
  if(FG.sortiert[art]) return FG.sortiert[art];
  var s=FG.l.slice();
  if(art==="name") s.sort(function(a,b){ return vergleich(a.name,b.name); });
  else if(art==="club") s.sort(function(a,b){ return vergleich(a.clubs[0].name,b.clubs[0].name) || b.nutzen-a.nutzen || vergleich(a.name,b.name); });
  else s.sort(function(a,b){ return b.nutzen-a.nutzen || vergleich(a.name,b.name); });
  return (FG.sortiert[art]=s);
}
/* Werte für einen Filter mit Anzahl Firmen, z. B. alle Branchen */
function fsWerte(feld){
  var m={}, l=[];
  FG.l.forEach(function(x){ var da={};
    x.e.forEach(function(y){ var roh=feld(y); if(!roh) return; var k=norm(roh); if(da[k]) return; da[k]=1;
      if(!m[k]){ m[k]={ v:k, t:String(roh).trim(), n:0 }; l.push(m[k]); } m[k].n++; });
  });
  return l.sort(function(a,b){ return vergleich(a.t,b.t); });
}
function fsAktiv(){ var o=S.fs; return [o.club,o.liga,o.branche,o.verbindung,o.min,o.ap].filter(Boolean).length; }
/* Passt eine Club-Verbindung zu allen gesetzten Filtern? */
function fsPasst(y){
  var o=S.fs;
  return (!o.club||y.c.id===o.club) && (!o.liga||y.liga===o.liga) && (!o.branche||y.br===o.branche) &&
    (!o.verbindung||y.vb===o.verbindung) && y.n>=(o.min?Number(o.min):-1) && (!o.ap||y.p);
}
function firmenFiltern(){
  var o=S.fs, w=ohneAkzent(o.q).split(/\s+/).filter(Boolean);
  // Nach Club sortieren ergibt bei einem gewählten Club nichts, dann nach Nutzen
  return firmenSortiert(o.sort==="club"&&o.club ? "nutzen" : o.sort).filter(function(x){
    for(var i=0;i<w.length;i++) if(x.such.indexOf(w[i])<0) return false;
    return x.e.some(fsPasst);
  });
}
function fsAuswahl(id,titel,optionen){ return '<div class="field"><label for="'+id+'">'+titel+'</label><select id="'+id+'">'+optionen+'</select></div>'; }
function fsOptionen(werte,gewaehlt,alleText){

    return '<option value="'+esc(w.v)+'"'+(w.v===gewaehlt?' selected':'')+'>'+esc(w.t)+(w.n!==undefined?' ('+w.n+')':'')+'</option>'; }).join("");
}

  var W=FG.werte;
  W.liga=fsWerte(function(y){ return y.c.liga; });

        fsAuswahl("fs_branche","Branche",fsOptionen(W.branche,o.branche,"Alle Branchen"))+
        fsAuswahl("fs_vb","Verbindung",fsOptionen(W.verbindung,o.verbindung,"Alle Arten"))+
        fsAuswahl("fs_min","Nutzen",["","30","50","70","85"].map(function(v){ return '<option value="'+v+'"'+(o.min===v?' selected':'')+'>'+(v?"ab "+v:"egal")+'</option>'; }).join(""))+
        fsAuswahl("fs_sort","Sortierung",[["nutzen","nach Nutzen"],["name","nach Name"],["club","nach Club"]].map(function(s){ return '<option value="'+s[0]+'"'+(o.sort===s[0]?' selected':'')+'>'+s[1]+'</option>'; }).join(""))+
      '</div>'+
      '<label class="check fs-ap"><input type="checkbox" id="fs_ap"'+(o.ap?' checked':'')+'><span><b>Nur mit Ansprechpartner</b></span></label>'+
    '</details>'+
    '<div class="fs-zeile"><b id="fs_zahl"></b><span class="spacer"></span><button class="btn ghost klein" id="fs_reset">Filter zurücksetzen</button></div>'+
    '<div class="knopfreihe" style="margin-bottom:12px"><button class="btn klein" id="fs_pdf">Treffer als PDF</button><button class="btn klein" id="fs_csv">Treffer als CSV</button></div>'+

function trefferZeichnen(){
  FT=firmenFiltern();
  var o=S.fs, z=Math.min(o.zahl,FT.length), a=fsAktiv(), gefiltert=!!(a||o.q.trim());

function druckLink(u,t){ u=linkUrl(u); return u ? '<a href="'+esc(u)+'">'+esc(t||u)+'</a>' : esc(t||""); }

function trefferCsv(l){
  if(!l.length) return;
  function eins(arr){ var out=[]; arr.forEach(function(v){ if(v&&out.indexOf(v)<0) out.push(v); }); return out.join(" | "); }
  var z=[["Firma","Nutzen","Branche","Ort","Land","Website","Clubs","Liga","Verbindung","Verbindung Details","Nutzen Grund","Kooperationsidee","Ansprechpartner","Position","Telefon","E-Mail","Quellen"]];
  l.forEach(function(x){
    var mehr=x.e.length>1;
    function je(k){ return x.e.map(function(y){ var v=y.f[k]; return v ? (mehr?y.c.name+": ":"")+v : ""; }).filter(Boolean).join(" | "); }
    var ps=[]; x.e.forEach(function(y){ if(y.p&&ps.indexOf(y.p)<0) ps.push(y.p); });
    var qs=[]; x.e.forEach(function(y){ (y.f.quellen||[]).forEach(function(q){ if(q.url) qs.push(q.url); }); });
    z.push([x.name, x.nutzen<0?"":x.nutzen, x.branche, x.ort, x.land, x.website,
      eins(x.clubs.map(function(c){ return c.name; })), eins(x.clubs.map(function(c){ return c.liga; })),
      je("verbindung"), je("verbindungText"), je("nutzenGrund"), je("kooperationsidee"),
      eins(ps.map(function(p){ return p.name; })), eins(ps.map(function(p){ return p.position; })),
      eins(ps.map(function(p){ return wegeVon(p,"Telefon"); })), eins(ps.map(function(p){ return wegeVon(p,"E-Mail"); })), eins(qs)]);
  });
  // Formeln aus fremden Texten nicht in Excel ausführen lassen
  var csv="\ufeff"+z.map(function(r){ return r.map(function(v){ v=String(v==null?"":v); if(/^[=@]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; }).join(";"); }).join("\r\n");

/* ---------------- Anmeldung ----------------
   Echte Anmeldung über Supabase mit E-Mail und Passwort. Konten gibt es nur über Einladungslinks vom Admin
   (Registrieren ist in Supabase abgeschaltet). Der Link sieht so aus: Adresse der App plus #einladung=... oder
   #passwort=... Der Schlüssel im Link wird erst beim Absenden eingelöst, damit Linkvorschauen ihn nicht verbrauchen.
   Wer angemeldet, aber nicht freigegeben ist, sieht keine Daten. Das prüft die Datenbank, nicht diese Seite. */
var LINK=null, LINK_EINGELOEST=false, WARTE_T=null;
(function(){
  var m=location.hash.match(/^#(einladung|passwort)=([A-Za-z0-9_-]+)$/);
  if(m){ LINK={ art:m[1]==="einladung"?"invite":"recovery", token:m[2] }; history.replaceState(null,"",location.pathname+location.search); }
})();
function gate(art){
  document.body.classList.add("gesperrt"); $("anmeldung").hidden=false;
  var f=$("anmeldeBox"), h='<div><h1>Netboard</h1>';
  f.onsubmit=function(ev_){ ev_.preventDefault(); };
  if(art==="anmelden"){
    h+='<p class="hint" style="margin:4px 0 0">Bitte anmelden.</p></div>'+
      '<div class="field"><label for="a_mail">E-Mail</label><input id="a_mail" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false"></div>'+
      '<div class="field"><label for="a_pw">Passwort</label><input id="a_pw" name="password" type="password" autocomplete="current-password"></div>'+
      '<p class="err" id="a_err" hidden></p>'+
      '<button class="btn primary" type="submit" id="a_los">Anmelden</button>'+
      '<button class="btn ghost" type="button" id="a_vergessen">Passwort vergessen?</button>';
    f.innerHTML=h;
    $("a_vergessen").onclick=function(){ gate("vergessen"); };
    f.onsubmit=function(ev_){ ev_.preventDefault(); anmelden(); };
    setTimeout(function(){ $("a_mail").focus(); },50);
  } else if(art==="vergessen"){
    h+='</div><p style="margin:0">Schreib dem Admin. Er setzt dir ein neues Passwort, das du danach unter Einstellungen änderst.</p>'+
      '<button class="btn" type="button" id="a_zurueck">Zur Anmeldung</button>';
    f.innerHTML=h; $("a_zurueck").onclick=function(){ gate("anmelden"); };
  } else if(art==="passwort"){
    var neu=LINK && LINK.art==="invite";
    h+='<p class="hint" style="margin:4px 0 0">'+(neu?'Willkommen. Lege dein Passwort fest, dann bist du drin.':'Lege ein neues Passwort fest.')+'</p></div>'+
      '<div class="field"><label for="a_neu">Neues Passwort</label><input id="a_neu" type="password" autocomplete="new-password"></div>'+
      '<div class="field"><label for="a_neu2">Noch einmal</label><input id="a_neu2" type="password" autocomplete="new-password"></div>'+
      '<p class="hint" style="margin:0">Mindestens 10 Zeichen.</p>'+
      '<p class="err" id="a_err" hidden></p>'+
      '<button class="btn primary" type="submit" id="a_los">Passwort speichern</button>';
    f.innerHTML=h;
    f.onsubmit=function(ev_){ ev_.preventDefault(); passwortSetzen(); };
    setTimeout(function(){ $("a_neu").focus(); },50);
  } else if(art==="warten"){
    h+='</div><p class="infobox">Dein Zugang ist angelegt und wartet auf die Freigabe durch den Admin. Danach geht es hier von allein weiter.</p>'+
      '<button class="btn" type="button" id="a_ab">Abmelden</button>';
    f.innerHTML=h; $("a_ab").onclick=abmelden;
  } else if(art==="fehler"){
    h+='</div><p class="warnbox">Die Verbindung zur Datenbank klappt gerade nicht. Bitte später noch einmal laden.</p>'+
      '<button class="btn" type="button" id="a_neuladen">Neu laden</button>';
    f.innerHTML=h; $("a_neuladen").onclick=function(){ location.reload(); };
  } else {
    f.innerHTML=h+'<p class="hint" style="margin:4px 0 0">Wird geladen …</p></div>';
  }
}
function gateFehler(t){ var e=$("a_err"); if(e){ e.hidden=false; e.textContent=t; } var b=$("a_los"); if(b) b.disabled=false; }
function anmelden(){
  var mail=$("a_mail").value.trim(), pw=$("a_pw").value;
  if(!mail||!pw) return gateFehler("E-Mail und Passwort eingeben.");
  $("a_los").disabled=true;
  sb.auth.signInWithPassword({ email:mail, password:pw }).then(function(r){
    if(r.error){
      console.error("Anmeldung",r.error);
      return gateFehler(/invalid/i.test(r.error.message||"") ? "E-Mail oder Passwort stimmt nicht." : "Hat nicht geklappt. Bitte gleich noch einmal.");
    }
    nachAnmeldung(r.data.user);
  }).catch(function(e){ console.error("Anmeldung",e); gateFehler("Hat nicht geklappt. Bitte gleich noch einmal."); });
}
function passwortSetzen(){
  var a=$("a_neu").value, b=$("a_neu2").value;
  if(a.length<10) return gateFehler("Das Passwort braucht mindestens 10 Zeichen.");
  if(a!==b) return gateFehler("Die beiden Passwörter sind nicht gleich.");
  $("a_los").disabled=true;
  var schritt=LINK_EINGELOEST ? Promise.resolve({}) : sb.auth.verifyOtp({ token_hash:LINK.token, type:LINK.art });
  schritt.then(function(r){
    if(r.error){ console.error("Link",r.error); throw { text:"Der Link gilt nicht mehr. Bitte beim Admin einen neuen anfordern." }; }
    LINK_EINGELOEST=true;
    return sb.auth.updateUser({ password:a });
  }).then(function(r){
    if(r.error){ console.error("Passwort",r.error); throw { text:/weak|short|least/i.test(r.error.message||"") ? "Das Passwort ist zu schwach. Bitte ein längeres nehmen." : "Hat nicht geklappt. Bitte gleich noch einmal." }; }
    LINK=null; LINK_EINGELOEST=false;
    toast("Passwort gespeichert.");
    nachAnmeldung(r.data.user);
  }).catch(function(e){ gateFehler(e&&e.text ? e.text : "Hat nicht geklappt. Bitte gleich noch einmal."); });
}
function nachAnmeldung(user){
  clearTimeout(WARTE_T);
  sb.from("mitglieder").select("id,email,name,rolle,freigegeben").eq("id",user.id).maybeSingle().then(function(r){
    if(r.error) throw r.error;
    if(!r.data || !r.data.freigegeben){
      ICH=null; gate("warten");
      WARTE_T=setTimeout(function(){ nachAnmeldung(user); },20000);
      return;
    }
    ICH=r.data; gate("laden");
    return allesLaden().then(appZeigen);
  }).catch(function(e){ console.error("Laden",e); gate("fehler"); });
}
function appZeigen(){
  document.body.classList.remove("gesperrt"); $("anmeldung").hidden=true;
  var av=document.querySelector("#einstBtn .avatar"); if(av) av.textContent=initialen(ICH.name||ICH.email);
  S.letzteSicht=null; zeichnen();
  clearInterval(ABRUF_T); ABRUF_T=setInterval(abrufen,30000);
}
function abmelden(){
  if((OFFEN||FEHLER) && !window.confirm("Noch nicht alles ist gespeichert. Trotzdem abmelden?")) return;
  clearInterval(ABRUF_T); clearTimeout(SYNC_T); clearTimeout(WARTE_T);
  ICH=null; D=leer(); SNAP={}; STAND={}; OFFEN=false; FEHLER=false;
  fensterZu(); S.sicht="start";
  sb.auth.signOut({ scope:"local" }).catch(function(){}).then(function(){ gate("anmelden"); });
}

/* ---------------- Mitglieder (nur Admin) ----------------
   Konto anlegen, neues Passwort setzen, freigeben und sperren. Anlegen und Passwort laufen über die
   Server-Funktion "konto" (geheimer Schlüssel bleibt dort), Freigabe direkt über die Tabelle.
   Ob etwas erlaubt ist, entscheiden Funktion und Datenbank, nicht diese Seite. */
function startPasswort(){
  var z="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789", a=new Uint32Array(12), s="";
  crypto.getRandomValues(a); for(var i=0;i<a.length;i++) s+=z.charAt(a[i]%z.length);
  return s;
}
function kontoAufruf(daten){
  return sb.functions.invoke("konto",{ body:daten }).then(function(r){
    if(r.error){
      var ctx=r.error.context;
      return (ctx && ctx.json ? ctx.json().catch(function(){ return {}; }) : Promise.resolve({})).then(function(j){
        console.error("konto",r.error,j); throw { text:(j&&j.fehler)||"Hat nicht geklappt." };
      });
    }
    return r.data;
  });
}
function zugangsText(email,pw){ return "Netboard: "+location.origin+location.pathname+"\nE-Mail: "+email+"\nPasswort: "+pw+"\nBitte nach dem ersten Anmelden unter Einstellungen ein eigenes Passwort setzen."; }
function zugangZeigen(box,email,pw){
  box.innerHTML='<div class="okbox" style="display:flex;flex-direction:column;gap:8px"><b>Zum Weitergeben</b>'+
    '<div class="mono" style="white-space:pre-wrap;word-break:break-all;font-size:13px">'+esc(zugangsText(email,pw))+'</div>'+
    '<button class="btn klein" type="button" data-zkopie="1">Text kopieren</button></div>';
  alle("[data-zkopie]",function(b){ b.onclick=function(){ kopieren(zugangsText(email,pw)); }; },box);
}
function mitgliederZeichnen(danach){
  var box=$("mitgliederBox"); if(!box) return;
  sb.from("mitglieder").select("id,email,name,rolle,freigegeben,angelegt").order("angelegt").then(function(r){
    if(r.error){ console.error("Mitglieder",r.error); box.innerHTML='<p class="err">Hat nicht geklappt.</p>'; return; }
    box.innerHTML=
      '<div class="box" style="display:flex;flex-direction:column;gap:10px;padding:12px;margin-bottom:10px">'+
        '<b>Neues Konto</b>'+
        '<div class="field"><label for="k_name">Name</label><input id="k_name" autocomplete="off"></div>'+
        '<div class="field"><label for="k_mail">E-Mail</label><input id="k_mail" type="email" autocomplete="off" autocapitalize="none" spellcheck="false"></div>'+
        '<div class="field"><label for="k_pw">Startpasswort</label><input id="k_pw" class="mono" autocomplete="off" spellcheck="false" value="'+esc(startPasswort())+'"></div>'+
        '<p class="err" id="k_err" hidden></p>'+
        '<button class="btn primary" type="button" id="k_los">Konto anlegen</button>'+
        '<div id="k_ergebnis"></div>'+
      '</div>'+
      (r.data||[]).map(function(m){
        var ich=ICH && m.id===ICH.id;
        return '<div class="box" style="display:flex;flex-direction:column;gap:8px;padding:10px 12px;margin-bottom:8px">'+
          '<div style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><b>'+esc(m.name||m.email)+'</b>'+(m.rolle==="admin"?' <span class="chip">Admin</span>':'')+
          '<div class="hint" style="word-break:break-all">'+esc(m.email)+' · '+(m.freigegeben?'freigegeben':'gesperrt')+'</div></div></div>'+
          (ich?'':'<div class="knopfreihe"><button class="btn klein" type="button" data-mpw="'+esc(m.id)+'" data-mail="'+esc(m.email)+'">Neues Passwort</button>'+
            '<button class="btn klein'+(m.freigegeben?' ghost':' primary')+'" type="button" data-mfrei="'+esc(m.id)+'" data-wert="'+(m.freigegeben?'0':'1')+'">'+(m.freigegeben?'Sperren':'Freigeben')+'</button></div>'+
            '<div data-mpwbox="'+esc(m.id)+'"></div>')+
        '</div>';
      }).join("");
    $("k_los").onclick=function(){
      var name=$("k_name").value.trim(), mail=$("k_mail").value.trim().toLowerCase(), pw=$("k_pw").value.trim(), f=$("k_err");
      f.hidden=true;
      if(!name||!mail||pw.length<10){ f.hidden=false; f.textContent="Name, E-Mail und ein Passwort mit mindestens 10 Zeichen eintragen."; return; }
      $("k_los").disabled=true;
      kontoAufruf({ aktion:"anlegen", name:name, email:mail, passwort:pw }).then(function(){
        toast("Konto angelegt.");
        mitgliederZeichnen(function(){ var e=$("k_ergebnis"); if(e) zugangZeigen(e,mail,pw); });
      }).catch(function(e){ $("k_los").disabled=false; f.hidden=false; f.textContent=e&&e.text?e.text:"Hat nicht geklappt."; });
    };
    alle("[data-mpw]",function(b){ b.onclick=function(){
      var pw=startPasswort(), ziel=box.querySelector('[data-mpwbox="'+b.dataset.mpw+'"]');
      b.disabled=true;
      kontoAufruf({ aktion:"passwort", id:b.dataset.mpw, passwort:pw }).then(function(){
        toast("Neues Passwort gesetzt."); zugangZeigen(ziel,b.dataset.mail,pw);
      }).catch(function(e){ b.disabled=false; toast(e&&e.text?e.text:"Hat nicht geklappt."); });
    }; },box);
    alle("[data-mfrei]",function(b){ b.onclick=function(){
      b.disabled=true;
      sb.from("mitglieder").update({ freigegeben:b.dataset.wert==="1" }).eq("id",b.dataset.mfrei).then(function(r2){
        if(r2.error){ console.error("Freigabe",r2.error); toast("Hat nicht geklappt."); }
        else toast(b.dataset.wert==="1"?"Freigegeben.":"Gesperrt.");
        mitgliederZeichnen();
      });
    }; },box);
    if(danach) danach();
  });
}
/* Eigenes Passwort ändern, für alle Mitglieder */
function passwortAendern(){
  var a=$("p_neu").value, b=$("p_neu2").value, f=$("p_err");
  f.hidden=true;
  if(a.length<10){ f.hidden=false; f.textContent="Mindestens 10 Zeichen."; return; }
  if(a!==b){ f.hidden=false; f.textContent="Die beiden Passwörter sind nicht gleich."; return; }
  $("p_los").disabled=true;
  sb.auth.updateUser({ password:a }).then(function(r){
    $("p_los").disabled=false;
    if(r.error){ console.error("Passwort",r.error); f.hidden=false; f.textContent=/same|different/i.test(r.error.message||"")?"Das ist schon dein Passwort.":"Hat nicht geklappt."; return; }
    $("p_neu").value=""; $("p_neu2").value=""; toast("Passwort geändert.");
  });
}

/* ---------------- Umzug (nur Admin) ----------------
   Schreibt den alten Browser-Stand einmal in die Datenbank. Gleiche IDs werden überschrieben, also darf man
   es wiederholen. Danach wird gezählt: jede ID aus dem Browser muss in der Datenbank stehen.
   Der Browser-Stand bleibt liegen. */
function browserBestand(){
  var roh=LS.get(SCHLUESSEL); if(!roh) return null;
  try{ return normal(JSON.parse(roh)); }catch(e){ return null; }
}
function zaehlenDb(t){
  return sb.from(t).select("id",{ count:"exact", head:true }).then(function(r){ if(r.error) throw r.error; return r.count||0; });
}
function umzug(){
  var lok=browserBestand(); if(!lok) return;
  var plan=TABELLEN.map(function(t){
    var ids={}, doppelt=0, zeilen=[];
    lok[t].forEach(function(o){ if(!o||!o.id) return; if(ids[o.id]) doppelt++; ids[o.id]=o; });
    Object.keys(ids).forEach(function(id){ zeilen.push({ id:id, daten:ids[id] }); });
    return { t:t, browser:lok[t].length, doppelt:doppelt, zeilen:zeilen };
  });
  fenster("Bestand übernehmen",'<p class="hint" style="margin:0" id="uStand">Zähle vorher …</p><div id="uErgebnis"></div>','');
  KETTE=KETTE.then(function(){
    return Promise.all(TABELLEN.map(zaehlenDb)).then(function(vorher){
      plan.forEach(function(p,i){ p.vorher=vorher[i]; });
      $("uStand").textContent="Schreibe in die Datenbank …";
      var schritte=[];
      plan.forEach(function(p){
        for(var i=0;i<p.zeilen.length;i+=400) (function(teil){
          schritte.push(function(){ return sb.from(p.t).upsert(teil).then(function(r){ if(r.error) throw r.error; }); });
        })(p.zeilen.slice(i,i+400));
      });
      schritte.push(function(){ return sb.from("einstellungen").upsert({ id:"gewichte", daten:lok.gewichte }).then(function(r){ if(r.error) throw r.error; }); });
      return schritte.reduce(function(a,f){ return a.then(f); },Promise.resolve());
    }).then(function(){
      $("uStand").textContent="Zähle nachher …";
      return Promise.all(plan.map(function(p){ return tabelleHolen(p.t,"id"); }));
    }).then(function(l){
      var allesDa=true;
      plan.forEach(function(p,i){
        var da={}; l[i].forEach(function(r){ da[r.id]=1; });
        p.nachher=l[i].length;
        p.fehlt=p.zeilen.filter(function(z){ return !da[z.id]; }).length;
        if(p.fehlt) allesDa=false;
      });
      var namen={ events:"Events", personen:"Personen", einladungen:"Einladungen", verbindungen:"Verbindungen", clubs:"Clubs", firmen:"Firmen" };
      console.log("Umzug",plan.map(function(p){ return { tabelle:p.t, browser:p.browser, doppelt:p.doppelt, vorher:p.vorher, nachher:p.nachher, fehlt:p.fehlt }; }));
      $("uStand").textContent="Fertig. Der Bestand im Browser bleibt unverändert liegen.";
      $("uErgebnis").innerHTML='<table class="mono" style="width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;margin-top:10px">'+
        '<tr style="text-align:right"><th style="text-align:left">Tabelle</th><th>Browser</th><th>DB vorher</th><th>DB nachher</th><th>fehlt</th></tr>'+
        plan.map(function(p){ return '<tr style="text-align:right;border-top:1px solid var(--line)"><td style="text-align:left;padding:6px 0">'+namen[p.t]+'</td><td>'+tausend(p.browser)+(p.doppelt?' ('+p.doppelt+' doppelt)':'')+'</td><td>'+tausend(p.vorher)+'</td><td>'+tausend(p.nachher)+'</td><td>'+p.fehlt+'</td></tr>'; }).join("")+
        '</table>'+(allesDa?'<p class="okbox" style="margin-top:10px">Vollständig: jeder Eintrag aus dem Browser steht in der Datenbank.</p>'
                          :'<p class="warnbox" style="margin-top:10px">Es fehlen Einträge. Bitte noch einmal übernehmen und dem Admin Bescheid geben.</p>');
      return allesLaden().then(function(){ S.letzteSicht=null; zeichnen(); });
    }).catch(function(e){
      console.error("Umzug",e);
      $("uStand").textContent="Hat nicht geklappt. Es ist nichts verloren, der Bestand im Browser bleibt liegen. Bitte noch einmal versuchen.";
    });
  });
}

  document.addEventListener("visibilitychange",function(){ if(!document.hidden) abrufen(); });

  }).catch(function(){ gate("anmelden"); });
}
start();
})();
